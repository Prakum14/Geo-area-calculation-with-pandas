## How to Set It Up

1.  **Create the Directory:** Inside your main project folder (`project-area-analyzer`), create a new folder named **`.streamlit`** (note the preceding dot).
    ```
    project-area-analyzer/
    ├── app.py
    ├── requirements.txt
    ├── README.md
    ├── ML/
    │   └── classifier.py
    └── .streamlit/          <-- NEW FOLDER
        └── config.toml      <-- NEW FILE

